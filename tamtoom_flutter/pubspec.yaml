name: tamtoom_customer
description: تطبيق طمطوم للعميل - خضروات وفواكه طازجة
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP
  http: ^1.2.0

  # State Management
  provider: ^6.1.2

  # Storage
  shared_preferences: ^2.2.3

  # Image
  cached_network_image: ^3.3.1

  # Navigation
  go_router: ^13.2.0

  # Location
  geolocator: ^11.0.0

  # UI
  flutter_rating_bar: ^4.0.1
  shimmer: ^3.0.0
  badges: ^3.1.2
  fluttertoast: ^8.2.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
