name: tamtom_store
description: تطبيق طمطوم - متجر الخضار والفواكه
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # WebView
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0

  # Firebase (Push Notifications)
  firebase_core: ^3.8.1
  firebase_messaging: ^15.1.6

  # HTTP
  http: ^1.2.2
  dio: ^5.7.0

  # Local Storage
  shared_preferences: ^2.3.4
  flutter_secure_storage: ^9.2.4

  # UI
  flutter_svg: ^2.0.17
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  lottie: ^3.3.1
  flutter_spinkit: ^5.2.1

  # Connectivity
  connectivity_plus: ^6.1.1

  # URL Launcher
  url_launcher: ^6.3.1

  # Permissions
  permission_handler: ^11.3.1

  # Device Info
  device_info_plus: ^11.2.0
  package_info_plus: ^8.1.2

  # Fonts
  google_fonts: ^6.2.1

  # Local Notifications
  flutter_local_notifications: ^18.0.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
